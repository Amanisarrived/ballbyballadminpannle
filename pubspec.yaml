name: cricket_admin
description: Cricket Match Admin Panel - Live Ball Control
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1  # only this, web will work automatically

  # UI
  cupertino_icons: ^1.0.2
  intl: ^0.20.2
  provider: ^6.1.5+1
  firebase_app_check: ^0.3.2+10
  http: ^1.6.0
  firebase_database: ^11.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
